# Run workers as root — container lacks CAP_CHOWN so nginx can't setuid to the nginx user
user root;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

http {
    access_log /dev/stdout;

    server {
        listen 80;
        listen [::]:80;

        location / {
            proxy_pass         http://127.0.0.1:2021;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8099;
        # Only accept connections from the HA ingress gateway
        allow 172.30.32.2;
        deny  all;

        # Required so sub_filter can operate on uncompressed upstream responses
        proxy_set_header Accept-Encoding "";

        location / {
            proxy_pass         http://127.0.0.1:2021;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Ingress-Path   $http_x_ingress_path;

            # Inject ingress base path so the SPA router and API client use the correct prefix
            sub_filter '<head>' '<head><script>window.__INGRESS_PATH__="$http_x_ingress_path";</script>';
            sub_filter_once on;

            # SSE / streaming support (required for realtime updates)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }
    }
}

events {
    worker_connections  1024;
}